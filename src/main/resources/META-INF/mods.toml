modLoader = "javafml"
loaderVersion = "[36,)"
license = "GNU GPLv3"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
PortalMod: Expanded adds more building blocks and test elements to PortalMod,
expanding the selection to include both portal games and all styles of Portal 2.

  MAIN TEAM
  Starch-Based Vegetable - Programmer
  Trufa - PortalMod: Deco Blocks / Art
  KonnyBoi - Art

  CONTRIBUTORS
  maybejahmess - Arbored Chamber Doors
  Tec - The Original Fizzler Texture Shader and Allowing Its Use'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[36,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "portalmod"
mandatory= true
versionRange = "[1.0,)"
ordering = "BEFORE"
side = "BOTH"